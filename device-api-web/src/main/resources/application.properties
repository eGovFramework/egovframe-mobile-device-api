# 로컬 실행이 기본값
# DEV/운영으로 올릴 때 [DEV/운영] 주석이 붙은 항목만 바꾼다.

server.port=9700

# 앱(실기기)이 접속할 서버 IP. 서버 URL, RAG, MQTT가 이 값을 쓴다.
# local.host=${LOCAL_HOST:}
local.host=${LOCAL_HOST:127.0.0.1}

# 로컬에서는 미사용(false)
# [DEV/운영] app.security.required=true
# [DEV/운영] spring.security.user.name=운영계정
# [DEV/운영] spring.security.user.password=운영비밀번호
app.security.required=false

# 인증을 켤 때 채운다. 비어 있으면 계정을 만들지 않는다.
# spring.security.user.name=
# spring.security.user.password=
spring.security.user.name=
spring.security.user.password=

# 브라우저 WebSocket 허용 출처. 
# Origin 헤더가 없는 네이티브 앱은 이 목록과 무관
# [DEV/운영] https://운영도메인:9700
app.websocket.allowed-origins=http://localhost:9700,http://127.0.0.1:9700
# 채팅 소켓 동시 접속 상한
app.websocket.max-sessions=50

# Swagger
# [DEV/운영] api-docs, swagger-ui, try-it-out 세 항목을 false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
springdoc.default-flat-param-object=true

# 업로드 크기 제한
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# 업로드 차단 확장자
Globals.dangerousFileExtensions=.exe,.bat,.cmd,.com,.pif,.scr,.vbs,.js,.jsp,.jspx,.php,.php3,.php4,.php5,.phtml,.asp,.aspx,.ashx,.asmx,.sh,.bash,.csh,.ksh,.pl,.py,.rb,.jar,.war,.ear,.dll,.so,.dylib,.class,.action,.do,.htaccess,.htpasswd,.html,.htm,.svg

# 미디어 업로드 허용 확장자
Globals.allowedMediaExtensions=.mp3,.wav,.aac,.mp4,.avi,.mov,.wmv,.flv,.mkv,.jpg,.jpeg,.png

# FCM OAuth Scope
Globals.fcmMessagingScope=https://www.googleapis.com/auth/firebase.messaging

# ai-rag 인덱싱 대상 확장자
ai-rag.allowedFileExtensions=.md,.pdf,.docx,.hwp,.hwpx

# SSE 중계가 생성 완료까지 끊기지 않도록 비동기 요청 제한(ms)
spring.mvc.async.request-timeout=600000

# DB. HSQL 파일 DB(./data/hsql/hyb), 최초 기동 시 script/hsql 적용
# [DEV/운영] MySQL 등 다른 DB를 쓰면 DbType, DriverClassName, Url, UserName, Password 를 교체
Globals.DbType=hsql
Globals.DriverClassName=org.hsqldb.jdbc.JDBCDriver
Globals.Url=jdbc:hsqldb:file:./data/hsql/hyb;shutdown=true
Globals.UserName=SA
Globals.Password=

# 업로드 저장 경로, 앱에 내려주는 서버 URL
# [DEV/운영] Globals.fileStorePath=업로드절대경로/
# [DEV/운영] Globals.serverContext=https://운영도메인:9700/
Globals.fileStorePath=${FILE_STORE_PATH:./data/upload/}
Globals.serverContext=http://${local.host}:${server.port}/

# FCM 서비스 계정 키(JSON)와 발송 URL. 키 파일은 패키지에 넣지 않는다.
# [DEV/운영] Globals.fcmSdk=Firebase서비스계정파일경로
# [DEV/운영] Globals.fcmRequestPath=https://fcm.googleapis.com/v1/projects/프로젝트ID/messages:send
# Globals.fcmSdk=${FCM_SDK_PATH:}
# Globals.fcmRequestPath=${FCM_REQUEST_PATH:}
Globals.fcmSdk=${FCM_SDK_PATH:}
Globals.fcmRequestPath=${FCM_REQUEST_PATH:}

# ai-rag(LLM) 서버
# [DEV/운영] Globals.AiRag.Url=https://RAG서버주소
# [DEV/운영] 모델이 다르면 Globals.AiRag.Model 을 교체
# [DEV/운영] ai-rag.fileStorePath=RAG문서절대경로
Globals.AiRag.Url=http://${local.host}:8080
Globals.AiRag.Model=qwen2.5:7b-instruct
# ai-rag.fileStorePath=${AI_RAG_STORE_PATH:}
ai-rag.fileStorePath=${AI_RAG_STORE_PATH:}

# MQTT 브로커. 서버는 접속하지 않고, 앱이 /iot/mqttConfig.do 값으로 접속
# [DEV/운영] 기본 비활성. 사용할 때만 enabled=true, host 와 계정을 채운다.
mqtt.enabled=true
mqtt.host=${local.host}
mqtt.port=1883
mqtt.username=
mqtt.password=
mqtt.device-id=device01
